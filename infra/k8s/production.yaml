apiVersion: v1
kind: Namespace
metadata:
  name: eduk12-prod
---
# 1. Go Core & Exam Engine (Auto-scale 4 -> 100 Pods theo CPU/Tải thi đồng loạt)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: eduk12-prod
spec:
  replicas: 4
  selector:
    matchLabels:
      app: core-api
  template:
    metadata:
      labels:
        app: core-api
    spec:
      containers:
        - name: core-api
          image: ghcr.io/huynhanh24h/edu-website/core-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: eduk12-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: core-api
  namespace: eduk12-prod
spec:
  selector:
    app: core-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-api-hpa
  namespace: eduk12-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core-api
  minReplicas: 4
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
# 2. Python FastAPI AI Tutor (Auto-scale 2 -> 40 Pods)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-tutor
  namespace: eduk12-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-tutor
  template:
    metadata:
      labels:
        app: ai-tutor
    spec:
      containers:
        - name: ai-tutor
          image: ghcr.io/huynhanh24h/edu-website/ai-tutor:latest
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: eduk12-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-tutor
  namespace: eduk12-prod
spec:
  selector:
    app: ai-tutor
  ports:
    - port: 8001
      targetPort: 8001
---
# 3. Next.js Web Frontend (Standalone - Auto-scale 3 -> 50 Pods)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: eduk12-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/huynhanh24h/edu-website/web:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: eduk12-prod
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 3000
