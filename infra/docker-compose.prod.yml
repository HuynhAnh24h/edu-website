services:
  nginx:
    image: nginx:1.27-alpine
    container_name: eduk12-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - core-api
      - ai-tutor

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CORE_API_URL: ""
        NEXT_PUBLIC_AI_API_URL: ""
    container_name: eduk12-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - core-api
      - ai-tutor

  core-api:
    build:
      context: ../services/core-api
      dockerfile: Dockerfile
    container_name: eduk12-core-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-edu_admin}:${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}@postgres:5432/${POSTGRES_DB:-edu_k12}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKERS: "redpanda:9092"
      JWT_SECRET: "${JWT_SECRET:-CHANGE_ME_64_CHAR_RANDOM_JWT_SECRET}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redpanda:
        condition: service_started

  ai-tutor:
    build:
      context: ../services/ai-tutor
      dockerfile: Dockerfile
    container_name: eduk12-ai-tutor
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-edu_admin}:${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}@postgres:5432/${POSTGRES_DB:-edu_k12}"
      REDIS_URL: "redis://redis:6379/0"
      AI_PROVIDER: "${AI_PROVIDER:-auto}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    container_name: eduk12-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-edu_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-edu_k12}"
    volumes:
      - pg_prod_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edu_admin} -d ${POSTGRES_DB:-edu_k12}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: eduk12-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: eduk12-kafka
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp 2
      - --memory 1G
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:9092
    volumes:
      - redpanda_prod_data:/var/lib/redpanda/data

volumes:
  pg_prod_data:
  redis_prod_data:
  redpanda_prod_data:
